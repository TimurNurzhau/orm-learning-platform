spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: docker-compose.yml

logging:
  level:
    com.example.ormlearning: DEBUG